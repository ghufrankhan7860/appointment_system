# coturn settings for compose.turn.yaml. The shared secret and the external
# address come from the command line, out of deploy/turn/.env.

realm=medappoint.in
listening-port=3478
tls-listening-port=5349
# Relay ports; the EC2 security group must allow this UDP range.
min-port=49152
max-port=49400

# Credentials are minted by the API (username "<expiry>:<peerId>", HMAC-SHA1
# password), so coturn keeps no user list.
use-auth-secret
fingerprint

cert=/certs/turn.crt
pkey=/certs/turn.key
no-tlsv1
no-tlsv1_1

no-cli
no-multicast-peers
# Never relay into the host's own or private networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

log-file=stdout
simple-log
