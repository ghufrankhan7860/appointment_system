services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_DB: appointment_system
            POSTGRES_USER: appointment
            POSTGRES_PASSWORD: appointment-local
        ports:
            - "5434:5432"
        volumes:
            - appointment_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U appointment -d appointment_system"]
            interval: 2s
            timeout: 2s
            retries: 20
        restart: unless-stopped

    migrate:
        image: migrate/migrate:v4.18.3
        volumes:
            - ../migrations:/migrations:ro
        command:
            - "-path=/migrations"
            - "-database=postgres://appointment:appointment-local@postgres:5432/appointment_system?sslmode=disable"
            - "up"
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"

    api:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}
        environment:
            APP_NAME: appointment-system
            HTTP_ADDRESS: ":8080"
            DB_HOST: postgres
            DB_PORT: "5432"
            DB_USER: appointment
            DB_PASSWORD: appointment-local
            DB_NAME: appointment_system
            JWT_SECRET: appointment-local-jwt-secret-change-me
            JWT_ISSUER: appointment-system
            GIN_MODE: release
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        restart: unless-stopped

volumes:
    appointment_postgres_data:
