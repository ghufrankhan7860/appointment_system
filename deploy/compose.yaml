services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_DB: ${DB_NAME:-appointment_system}
            POSTGRES_USER: ${DB_USER:-appointment}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-appointment-local}
        ports:
            - "5434:5432"
        volumes:
            - appointment_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 2s
            timeout: 2s
            retries: 20
        restart: unless-stopped

    migrate:
        image: migrate/migrate:v4.18.3
        volumes:
            - ../migrations:/migrations:ro
        command:
            - "-path=/migrations"
            - "-database=postgres://${DB_USER:-appointment}:${DB_PASSWORD:-appointment-local}@postgres:5432/${DB_NAME:-appointment_system}?sslmode=disable"
            - "up"
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"

    api:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            args:
                GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}
        environment:
            APP_NAME: appointment-system
            HTTP_ADDRESS: ":8080"
            DB_HOST: postgres
            DB_PORT: "5432"
            DB_USER: ${DB_USER:-appointment}
            DB_PASSWORD: ${DB_PASSWORD:-appointment-local}
            DB_NAME: ${DB_NAME:-appointment_system}
            JWT_SECRET: appointment-local-jwt-secret-change-me
            JWT_ISSUER: appointment-system
            GIN_MODE: release
            # Local stack: the none payment gateway and local file storage are allowed.
            APP_ENV: development
            STORAGE_LOCAL_DIR: /app/var/storage
            # Set these in the shell to run against Razorpay's test mode.
            PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
            RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
            RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
            RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
            # Empty (PAYMENT_METHODS= ) is none mode: every booking is paid at the clinic.
            PAYMENT_METHODS: ${PAYMENT_METHODS-razorpay}
        ports:
            - "8080:8080"
        volumes:
            - appointment_storage_data:/app/var/storage
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        restart: unless-stopped

volumes:
    appointment_postgres_data:
    appointment_storage_data:
