        enum:
        - scheduled
        - completed
        - cancelled
        - no_show
        - reschedule_proposed
        in: query
        name: status
        type: string
      - description: Starts at or after, like 2026-10-26T00:00:00+05:30
        in: query
        name: from
        type: string
      - description: Starts before, like 2026-10-27T00:00:00+05:30
        in: query
        name: to
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
