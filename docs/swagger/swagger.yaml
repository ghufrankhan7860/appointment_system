basePath: /api/v1
definitions:
  admin.CreateAdminRequest:
    properties:
      email:
        example: ops@example.com
        type: string
      mobileNo:
        example: "9876543210"
        type: string
      name:
        example: Ops Admin
        type: string
      password:
        maxLength: 72
        minLength: 12
        type: string
    required:
    - email
    - mobileNo
    - name
    - password
    type: object
  admin.CreateAdminResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      mobileNo:
        type: string
      name:
        type: string
      role:
        example: admin
        type: string
    type: object
  admin.CreateSpecialityRequest:
    properties:
