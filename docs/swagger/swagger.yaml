        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List who accessed a medical record
      tags:
      - admin
  /admin/refunds:
    get:
      description: Returns refunds in one status, oldest first. The default, requested,
        lists refunds Razorpay is still processing; its refund webhook or make reconcile-refunds
        settles them. Failed refunds can be retried with POST /admin/payments/{id}/refund.
        Limit defaults to 20 and is capped at 100.
      parameters:
      - description: Refund status
        enum:
        - requested
        - succeeded
        - failed
        in: query
        name: status
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Number of refunds to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
