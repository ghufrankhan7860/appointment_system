            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a report for a patient
      tags:
      - medical records
  /patients/{id}/records:
    get:
      description: Lists the patient's finalized records, newest first. Needs full
        access to the patient; other access levels get 404. Limit defaults to 20 and
        is capped at 100.
      parameters:
      - description: Patient ID
        in: path
        name: id
        required: true
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Number of records to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/record.ListRecordsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a patient's medical records
      tags:
      - medical records
  /payments/{id}/verify:
    post:
      consumes:
      - application/json
      description: Confirms with the gateway that the order was paid, captures the
        payment and marks the appointment paid. With Razorpay, send Checkout's razorpay_payment_id
        as providerPaymentId and razorpay_signature as signature; the server checks
        the signature against the stored order and fetches the payment from Razorpay.
        With none, send any providerPaymentId and the signature from clientPayload.
        Verifying a captured payment again with the same providerPaymentId returns
        it, so a webhook that captured it first is fine. If the booking expired first,
        the money is refunded and 409 is returned.
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Gateway proof of payment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payment.VerifyPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/payment.PaymentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm a payment
      tags:
      - payments
  /records/{id}:
    get:
      description: Returns a record with its attachments. The record's doctor sees
        it in any status; the patient side needs full access and sees finalized records
        only. Anyone else gets 404. Every read is written to the access log.
      parameters:
      - description: Medical record ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/record.MedicalRecordResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a medical record
      tags:
      - medical records
  /specialities:
    get:
      description: The controlled list of speciality slugs a doctor profile and search
        can use.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/doctor.ListSpecialitiesResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List specialities
      tags:
      - doctors
  /webhooks/payment:
    post:
      consumes:
      - application/json
      description: Called by Razorpay, never by clients, so it takes no token. Subscribe
        it to payment.captured, order.paid, refund.processed and refund.failed. The
        X-Razorpay-Signature HMAC must match the raw body, and a reported payment
        is confirmed with Razorpay's API again before any money is recorded. Repeats,
        other events and orders this service did not open get 200 and change nothing;
        money for a booking that was already cancelled is recorded and refunded. Only
        a bad signature gets 401; a 5xx makes Razorpay retry. The body is limited
        to 64 KB.
      parameters:
      - description: hex HMAC-SHA256 of the raw body, keyed with the webhook secret
        in: header
        name: X-Razorpay-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Receive a payment gateway callback
      tags:
      - payments
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the jwtToken returned by login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
