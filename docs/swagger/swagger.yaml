  /appointments:
    get:
      description: Lists the appointments of every patient the caller has active access
        to, earliest first. from is inclusive and to exclusive. Limit defaults to
        20 and is capped at 100.
      parameters:
      - description: Only this patient
        in: query
        name: patientId
        type: integer
      - description: Only this status
        enum:
        - scheduled
        - completed
        - cancelled
        - no_show
        - reschedule_proposed
        in: query
        name: status
        type: string
      - description: Starts at or after, like 2026-10-26T00:00:00+05:30
        in: query
        name: from
        type: string
      - description: Starts before, like 2026-10-27T00:00:00+05:30
        in: query
        name: to
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Number of appointments to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/appointment.ListAppointmentsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List appointments
      tags:
      - appointments
    post:
      consumes:
      - application/json
      description: Books a free slot of a verified doctor for a patient the caller
        has full or appointments_only access to. startsAt and mode must match a slot
        from GET /doctors/{id}/slots; the end time, fee and slot length come from
        the server.
      parameters:
      - description: Booking
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appointment.BookAppointmentRequest'
      - description: Client key; a retry with the same key and body returns the first
          booking
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/appointment.AppointmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Book an appointment
      tags:
      - appointments
  /appointments/{id}:
    get:
      description: Returns an appointment of a patient the caller has active access
        to, or one where the caller is the doctor. Other appointments are reported
        as not found.
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: integer
