info:
  contact: {}
  description: 'Appointment management backend: accounts, patients and the user-patient
    access model.'
  title: Appointment System API
  version: "1.0"
paths:
  /admin/doctors:
    get:
      description: Lists doctors in any status, oldest first. Use status=pending for
        the review queue.
      parameters:
      - description: Verification status
        enum:
        - pending
        - verified
        - rejected
        - suspended
        in: query
        name: status
        type: string
      - description: Page size, default 20, max 100
        in: query
        name: limit
        type: integer
      - description: Number of doctors to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListDoctorsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List doctors for review
      tags:
      - admin
  /admin/doctors/{id}:
