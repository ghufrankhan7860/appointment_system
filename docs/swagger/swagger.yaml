            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a medical record
      tags:
      - medical records
  /specialities:
    get:
      description: The controlled list of speciality slugs a doctor profile and search
        can use.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/doctor.ListSpecialitiesResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List specialities
      tags:
      - doctors
  /staff/me:
    get:
      description: Returns the doctor the calling staff account works for. 404 when
        it works for no doctor now (it was removed); join another with POST /staff/me/join.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/staff.GetStaffMeResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the doctor a staff account works for
      tags:
      - staff
  /staff/me/join:
    post:
      consumes:
      - application/json
      description: Links a staff account that works for no doctor now to the doctor
        whose invite code it gives. Wrong codes are limited per IP address.
      parameters:
      - description: Invite code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/staff.JoinStaffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/staff.GetStaffMeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Join a doctor as staff
      tags:
      - staff
  /webhooks/payment:
    post:
      consumes:
      - application/json
      description: Called by Razorpay, never by clients, so it takes no token. Subscribe
        it to payment.captured, order.paid, refund.processed and refund.failed. The
        X-Razorpay-Signature HMAC must match the raw body, and a reported payment
        is confirmed with Razorpay's API again before any money is recorded. Repeats,
        other events and orders this service did not open get 200 and change nothing;
        money for a booking that was already cancelled is recorded and refunded. Only
        a bad signature gets 401; a 5xx makes Razorpay retry. The body is limited
        to 64 KB.
      parameters:
      - description: hex HMAC-SHA256 of the raw body, keyed with the webhook secret
        in: header
        name: X-Razorpay-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Receive a payment gateway callback
      tags:
      - payments
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the jwtToken returned by login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
