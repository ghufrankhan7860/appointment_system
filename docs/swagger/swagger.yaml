  /calls/ws:
    get:
      description: "Upgrades to a WebSocket for the call the token was issued for
        (wsToken from a join response, valid 15 minutes). Messages are JSON {\"type\":
        ...}. The server sends welcome (your peerId, the peers already in and chatOff),
        peer-joined, peer-left, lobby, offer/answer/ice (with from), media, host,
        chat, chat-reaction, chat-delete, chat-settings, ended and error. Clients
        send offer, answer and ice (with to), media {mode}, state {state: connected|relay|failed},
        leave, chat {text, at most 2000 characters}, chat-reaction {messageId, emoji:
        one of \U0001F44D ❤️ \U0001F602 \U0001F62E \U0001F622 \U0001F64F, reacted},
        and, as a code room host, host {action: admit|deny|remove|mute|unmute|end,
        peerId}. A code room host or an appointment's doctor also sends chat-delete
        {messageId} and chat-settings {chatOff}; while chat is off only they can send
        or react. Chat goes to everyone admitted, the sender included, with from and
        a server messageId, and is never stored. The newcomer sends the offers. The
        server pings every 20 seconds; a peer silent for 60 seconds is out of the
        room."
      parameters:
      - description: Call token (wsToken)
        in: query
        name: token
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Open the call signaling WebSocket
      tags:
      - calls
