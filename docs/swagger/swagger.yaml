        The doctor resubmits by updating the profile, which moves it back to pending.
      parameters:
      - description: Doctor ID
        in: path
        name: id
        required: true
        type: integer
      - description: Reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.ReviewDoctorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
