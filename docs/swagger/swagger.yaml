  /auth/login:
    post:
      consumes:
      - application/json
      description: Log in with exactly one of email or mobileNo and a password. Opens
        a session (one per device login) that records the client IP, the User-Agent
        and Accept-Language, and the optional X-Device-* and X-App-Version headers;
        GET /auth/sessions lists them. The jwtToken carries the session ID.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      - description: Random ID the app keeps per install or browser (max 64)
        in: header
        name: X-Device-Id
        type: string
      - description: Device name, such as Ghufran's Pixel 8 (max 100)
        in: header
        name: X-Device-Name
        type: string
      - description: web, android or ios
        in: header
        name: X-Device-Platform
        type: string
      - description: App version (max 30)
        in: header
        name: X-App-Version
        type: string
      - description: Screen size as WxH, such as 1080x2400
        in: header
        name: X-Device-Screen
        type: string
      - description: IANA time zone, such as Asia/Kolkata
        in: header
        name: X-Device-Timezone
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the refresh token. Logging out an unknown token still succeeds.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token on the same session and returns a new
        jwtToken and refreshToken. The session's last-seen IP and time, User-Agent,
        app version and timezone are updated from this request; its login IP and device
        ID never change.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      - description: The ID sent at login; a different one is logged
        in: header
        name: X-Device-Id
        type: string
      - description: App version (max 30)
        in: header
        name: X-App-Version
        type: string
      - description: IANA time zone, such as Asia/Kolkata
        in: header
        name: X-Device-Timezone
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.RefreshResponse'
