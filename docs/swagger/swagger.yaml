      security:
      - BearerAuth: []
      summary: Get an appointment
      tags:
      - appointments
  /appointments/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Cancels a scheduled appointment that has not started. The patient
        side needs full or appointments_only access and must cancel at least 2 hours
        before the start; the doctor can cancel until the start.
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/appointment.CancelAppointmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/appointment.AppointmentResponse'
              type: object
        "400":
