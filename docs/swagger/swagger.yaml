          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify a pending doctor
      tags:
      - admin
  /admin/payments/{id}/refund:
    post:
      consumes:
      - application/json
      description: Refunds a captured payment in full through its gateway. The appointment's
        payment status becomes refunded. Cancelled paid appointments are refunded
        automatically; this is for everything else. Razorpay refunds at normal speed
        and finishes later, so it usually returns 202 with refundPending true and
        the payment still captured; its refund.processed webhook then marks it refunded.
        A refund Razorpay refuses returns 409 and is listed as failed in GET /admin/refunds;
        refunding the payment again retries it.
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional note
        in: body
        name: request
        schema:
          $ref: '#/definitions/admin.RefundPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.RefundPaymentResponse'
              type: object
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.RefundPaymentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dtos.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refund a payment
      tags:
      - admin
  /admin/records/{id}/access-log:
    get:
      description: Returns every create, edit, finalize, view and download of a record
        and its files, newest first, with the user and the request's correlation id.
        It never shows what the record says. Limit defaults to 20 and is capped at
        100.
      parameters:
      - description: Medical record ID
        in: path
        name: id
        required: true
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Number of entries to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dtos.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListAccessLogResponse'
              type: object
        "400":
