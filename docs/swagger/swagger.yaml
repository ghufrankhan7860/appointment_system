  /calls/code/{code}:
    post:
      consumes:
      - application/json
      description: 'Public: joins a doctor''s code room with its 7-digit code (spaces
        and dashes are ignored; a wrong check digit is answered 400 and not counted).
        With a lobby, waiting is true until the host admits the joiner. 5 wrong codes
        or links from one IP within 10 minutes block joins from it for the rest of
        the window.'
      parameters:
      - description: Join code
        in: path
